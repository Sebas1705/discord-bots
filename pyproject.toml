[project]
name = "overlord"
version = "0.1.0"
description = "Overlord - all-in-one Discord bot for a small personal server"
requires-python = ">=3.13"
dependencies = [
    "py-cord>=2.6",
    "python-dotenv>=1.0",
    "yt-dlp>=2024.8.6",
    "PyNaCl>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
overlord = "overlord.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overlord"]

[tool.pytest.ini_options]
testpaths = ["tests"]
